name: Update AltStore source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - catalog/projects.json
      - scripts/audit-ipa.sh
      - scripts/generate-store-source.sh
      - scripts/validate-catalog.sh
      - .github/workflows/update-altstore-source.yml

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Redownload, audit, and generate source
        env:
          PAD_PORTS_SOURCE_OUTPUT: site/source.json
        run: ./scripts/generate-store-source.sh

      - name: Upload audited site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy audited source
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
